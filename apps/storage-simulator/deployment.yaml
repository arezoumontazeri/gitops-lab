apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-simulator
  labels:
    app.kubernetes.io/name: storage-simulator
    app.kubernetes.io/part-of: observability-lab
spec:
  replicas: 1                 # one process = exact counters + one throttle switch
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-simulator
        app.kubernetes.io/part-of: observability-lab
    spec:
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown 10001:10001 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"], add: ["CHOWN"]}
          resources:
            limits: {cpu: 50m, memory: 16Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: simulator
          image: ghcr.io/arezoumontazeri/storage-simulator
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: DATA_DIR, value: /data}
            - {name: QUOTA_BYTES, value: "209715200"}       # 200 MiB SIMULATED quota
            - {name: MAX_WRITE_BYTES, value: "10485760"}    # 10 MiB per write
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-simulator-data
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
