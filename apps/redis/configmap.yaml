apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app.kubernetes.io/name: redis
data:
  redis.conf: |
    # Lab limits: small on purpose, so Row 5 tests stay safe
    maxmemory 128mb
    maxmemory-policy noeviction
    maxclients 100
    # No persistence: in-memory broker (documented trade-off)
    save ""
    appendonly no
