apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-api
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: observability-lab
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: observability-lab
    spec:
      initContainers:
        - name: fix-shared-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown 10001:10001 /mnt/shared && ls -ld /mnt/shared"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"], add: ["CHOWN"]}
          volumeMounts:
            - {name: shared, mountPath: /mnt/shared}
      containers:
        - name: api
          image: ghcr.io/arezoumontazeri/demo-app:0.1.0
          ports:
            - name: http
              containerPort: 8000
          env:
            - {name: PGHOST, value: postgres}
            - {name: PGPORT, value: "5432"}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
            - {name: REDIS_HOST, value: redis}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-credentials, key: REDIS_PASSWORD}}
            - {name: SHARED_DIR, value: /mnt/shared}
            - {name: DB_POOL_MAX, value: "5"}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: shared, mountPath: /mnt/shared}
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
