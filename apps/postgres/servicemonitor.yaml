apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
    matchExpressions:
      - {key: kubernetes.io/service-name, operator: DoesNotExist}
  endpoints:
    - port: metrics
      interval: 15s
