apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-checks
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: observability-lab
    lab.celery/queue: checks
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
      app.kubernetes.io/component: worker
      lab.celery/queue: checks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: observability-lab
        lab.celery/queue: checks
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ghcr.io/arezoumontazeri/demo-app
          command: ["celery"]
          args: ["-A", "app.worker:celery_app", "worker", "-Q", "checks", "-n", "checks@%h", "--concurrency=2", "--loglevel=INFO"]
          env:
            - {name: REDIS_HOST, value: redis}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-credentials, key: REDIS_PASSWORD}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
