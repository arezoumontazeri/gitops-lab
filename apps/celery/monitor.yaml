apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-monitor
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: monitor
    app.kubernetes.io/part-of: observability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
      app.kubernetes.io/component: monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/component: monitor
        app.kubernetes.io/part-of: observability-lab
    spec:
      containers:
        - name: monitor
          image: ghcr.io/arezoumontazeri/demo-app
          command: ["python", "-m", "app.monitor"]
          env:
            - {name: REDIS_HOST, value: redis}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-credentials, key: REDIS_PASSWORD}}
          ports:
            - name: metrics
              containerPort: 9808
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: celery-monitor
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: monitor
spec:
  selector:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: monitor
  ports:
    - name: metrics
      port: 9808
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: celery-monitor
  labels:
    app.kubernetes.io/name: demo-app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
      app.kubernetes.io/component: monitor
  endpoints:
    - port: metrics
      interval: 15s
